<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仝娘之家 The Home of AI-musume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg-wrapper">
    <img id="bgimg"
        src="{{ url_for('static', filename='imgs/group002.png') }}"
        alt="Background Image">
    <div class="bg-overlay"></div>
  </div>

  <header class="header">
    <a class="logo" href="{{ url_for('home') }}">
      <span class="logo-text">仝娘之家</span>
      <span class="logo-sub">AI-MUSUME</span>
    </a>

    <form class="search-box" action="{{ url_for('search') }}" method="get" role="search">
      <input id="searchinp" name="q" type="text"
             placeholder="搜索仝娘 / 设定 / 关键字……"
             value="{{ q or '' }}" autocomplete="off">
    </form>

    <nav class="nav">
      <a class="nav-btn {{ 'active' if nav=='home' }}"    href="{{ url_for('home') }}">首页</a>
      <a class="nav-btn {{ 'active' if nav=='gallery' }}" href="{{ url_for('gallery') }}">图鉴</a>
      <a class="nav-btn {{ 'active' if nav=='news' }}"    href="{{ url_for('news_gallery') }}">新闻</a>
      <a class="nav-btn {{ 'active' if nav=='about' }}"   href="{{ url_for('about') }}">关于</a>
    </nav>
  </header>

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>

    <footer class="footer">
      <p>© 2026 仝娘之家 The Home of AI-musume | version 0.3 | Powered by Python</p>
    </footer>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
